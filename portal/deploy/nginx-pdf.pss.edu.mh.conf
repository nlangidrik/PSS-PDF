# VM ports 8090 (editor) and 3002 (portal) must be firewalled so only this nginx host can reach them.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format pss_pdf '$remote_addr - $pss_user_email [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';

server {
    listen 80;
    server_name pdf.pss.edu.mh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pdf.pss.edu.mh;
    set $pss_user_email -;

    ssl_certificate     /etc/ssl/certs/pdf.pss.edu.mh.crt;
    ssl_certificate_key /etc/ssl/private/pdf.pss.edu.mh.key;

    client_max_body_size 2g;

    access_log /var/log/nginx/pdf.pss.edu.mh.access.log pss_pdf;

    location /portal/ {
        proxy_pass http://192.168.84.23:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /_pss_gate {
        internal;
        proxy_pass http://192.168.84.23:3002/portal/api/gate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_request /_pss_gate;
        auth_request_set $pss_user_email $upstream_http_x_pss_user_email;
        error_page 401 = @portal_login;

        proxy_pass http://192.168.84.23:8090;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location @portal_login {
        return 302 /portal/login?callbackUrl=$request_uri;
    }
}
